
</section>
</main>

<footer>
<button data-p="home" onclick="show('home')"><span>⌂</span>Home</button>
<button data-p="packages" onclick="show('packages')"><span>♛</span>Packages</button>
<button data-p="account" onclick="show('account')"><span>♙</span>Account</button>
<button data-p="support" onclick="show('support')"><span>✉</span>Support</button>
<button onclick="logout()"><span>↪</span>Logout</button>
</footer>

<script>
const PASSWORD='5432190';
const STORAGE_KEY='astralink_state_v2';

const packageInfo={
1:{amount:800,value:4000,days:1},
2:{amount:5000,value:30000,days:10},
3:{amount:10000,value:50000,days:7},
4:{amount:15000,value:75000,days:7},
5:{amount:20000,value:100000,days:7}
};

const initialExpired=[
{id:'initial-expired-2500',number:1,amount:2500,value:6000,days:3}
];

let loggedIn=false;
let walletBalance=0;
let withdrawWalletBalance=6000;
let activeItems=[];
let expiredItems=initialExpired.map(x=>({...x}));

function loadState(){
try{
const raw=localStorage.getItem(STORAGE_KEY);
if(raw){
const saved=JSON.parse(raw);
if(Array.isArray(saved.activeItems))activeItems=saved.activeItems;
if(Array.isArray(saved.expiredItems))expiredItems=saved.expiredItems;
if(Number.isFinite(saved.withdrawWalletBalance))withdrawWalletBalance=saved.withdrawWalletBalance;
}
}catch(e){}

if(!activeItems.some(x=>Number(x.number)===1&&Number(x.amount)===800)){
activeItems.unshift({
id:'active-package-800',
number:1,
amount:800,
value:4000,
days:1
});
}

if(!expiredItems.some(x=>x.id==='initial-expired-2500')){
expiredItems.unshift({...initialExpired[0]});
}
}

function saveState(){
try{
localStorage.setItem(STORAGE_KEY,JSON.stringify({
activeItems,expiredItems,withdrawWalletBalance
}));
}catch(e){}
}

loadState();

function login(){
if(document.getElementById('pass').value!==PASSWORD){
document.getElementById('err').textContent='Incorrect password';
return;
}
loggedIn=true;
document.getElementById('err').textContent='';
show('home');
}

function show(id){
const pages=['login','home','packages','qrpage','activePackages','expiredPackages','account','support'];
if(!pages.includes(id))return;
if(id!=='login'&&!loggedIn)id='login';

document.body.classList.toggle('logged-out',!loggedIn);
document.querySelectorAll('main > section').forEach(s=>{
s.classList.toggle('hidden',s.id!==id);
});
document.querySelectorAll('footer [data-p]').forEach(b=>{
b.classList.toggle('active',b.dataset.p===id);
});

window.scrollTo(0,0);
if(id==='activePackages'||id==='expiredPackages')renderPackages();
if(id==='account')updateBalance();
}

function buyPackage(n){
if(!loggedIn||!packageInfo[n])return;
document.getElementById('qrt').textContent='ADD MONEY';
show('qrpage');
}

function updateBalance(){
document.getElementById('balance').textContent='₹'+walletBalance.toLocaleString('en-IN');
document.getElementById('withdrawBalance').textContent='₹'+withdrawWalletBalance.toLocaleString('en-IN');
saveState();
}

function renderPackages(){
document.getElementById('activeList').innerHTML=activeItems.length
?activeItems.map(x=>`
<div class="packageRecord">
<div class="top"><b>PACKAGE ${x.number}</b><span class="activeTag">● ACTIVE</span></div>
<div class="amounts">
<div><div class="muted">PAY AMOUNT</div><div class="amount">₹${Number(x.amount).toLocaleString('en-IN')}</div></div>
<span class="gold">→</span>
<div class="center"><div class="muted">PACKAGE VALUE</div><div class="amount gold">₹${Number(x.value).toLocaleString('en-IN')}</div></div>
</div>
<div class="recordTime">Duration: ${Number(x.number)===1?'24 hours':x.days+' days'}</div>
</div>`).join('')
:'<p class="muted">No active packages yet.</p>';

document.getElementById('expiredList').innerHTML=expiredItems.length
?expiredItems.map(x=>`
<div class="packageRecord">
<div class="top"><b>PACKAGE ${x.number}</b><span class="expiredTag">● EXPIRED</span></div>
<div class="recordTime">Pay amount: ₹${Number(x.amount).toLocaleString('en-IN')} · Package value: ₹${Number(x.value).toLocaleString('en-IN')} · Duration: ${x.days} days</div>
</div>`).join('')
:'<p class="muted">No expired packages yet.</p>';

saveState();
}

function saveBankDetails(e){
e.preventDefault();
document.getElementById('msg').classList.remove('hidden');
return false;
}

function logout(){
loggedIn=false;
document.getElementById('pass').value='';
document.getElementById('email').value='';
document.getElementById('err').textContent='';
show('login');
}

updateBalance();
renderPackages();
show('login');
</script>
</body>
</html>
